# Vault web app: Vite single-page app (apps/vault/dist).
# Note: a location with its own add_header drops the server-level ones, so the
# security headers are repeated in each location.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Unknown paths get index.html; it must be revalidated so upgrades load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
