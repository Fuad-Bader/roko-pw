<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roko</title>
    <style>
      /* Roko brand fonts, self-hosted (SIL OFL 1.1, see fonts/*-OFL.txt) */
      @font-face { font-family: 'Inter'; font-weight: 400 700; font-display: swap; src: url(fonts/inter-latin-400-700.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 500 700; font-display: swap; src: url(fonts/space-grotesk-latin-500-700.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400 500; font-display: swap; src: url(fonts/jetbrains-mono-latin-400-500.woff2) format('woff2'); }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

      body {
        width: 320px;
        min-height: 400px;
        max-height: 600px;
        overflow-y: auto;
        background: #0A0D12;
        color: #F7F5F0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-size: 13px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid rgb(255 255 255 / 0.07);
        background: #0A0D12;
      }
      header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: -0.03em; flex: 1; color: #F7F5F0 }
      header h1 small { font: 500 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.04em; color: #FF5A1F; margin-left: 4px; vertical-align: 2px }
      header svg { display: block; flex: none }
      h2 { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em }

      #lock-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: #7A8391;
        font-size: 16px;
        padding: 6px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        transition: color 0.15s;
      }
      #lock-btn:hover { color: #FF7A45 }

      main { padding: 12px 14px }

      /* ── Unlock screen ── */
      #unlock-screen h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px }
      #unlock-form input, #create-form input {
        display: block;
        width: 100%;
        background: #171B22;
        border: 1px solid #252B35;
        border-radius: 8px;
        color: #F7F5F0;
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
        margin-bottom: 8px;
        transition: border-color 0.15s;
      }
      #unlock-form input:focus, #create-form input:focus { border-color: #FF5A1F }

      /* ── Buttons ── */
      .btn-primary {
        width: 100%;
        background: #FF5A1F;
        color: #0A0D12;
        border: none;
        border-radius: 999px;
        padding: 9px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        margin-top: 4px;
      }
      .btn-primary:hover { background: #FF7A45 }
      .btn-primary:disabled { opacity: 0.5; cursor: default }

      .btn-ghost {
        background: none;
        border: 1px solid #252B35;
        color: #A3ABB8;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-ghost:hover { background: #171B22; color: #F7F5F0 }

      /* ── Error ── */
      .error {
        background: #450a0a;
        color: #fca5a5;
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        margin-bottom: 8px;
      }

      /* ── Toggle mode ── */
      #toggle-mode {
        display: block;
        margin-inline: auto;
        text-align: center;
        margin-top: 10px;
        font-size: 11px;
        color: #5B6472;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #toggle-mode:hover { color: #A3ABB8 }

      /* ── Vault list ── */
      #vault-screen h2 {
        display: flex;
        align-items: center;
        gap: 7px;
        font: 500 10px/1 'JetBrains Mono', monospace;
        color: #FF7A45;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      #vault-screen h2::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: #FF5A1F }

      #search-input {
        display: block;
        width: 100%;
        background: #171B22;
        border: 1px solid #252B35;
        border-radius: 8px;
        color: #F7F5F0;
        padding: 7px 10px;
        font-size: 12px;
        outline: none;
        margin-bottom: 10px;
        transition: border-color 0.15s;
      }
      #search-input:focus { border-color: #FF5A1F }

      .entry-card {
        background: #0E1116;
        border: 1px solid #171B22;
        border-radius: 14px;
        padding: 10px 12px;
        margin-bottom: 8px;
        position: relative;
      }
      .entry-title { font-weight: 600; font-size: 13px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
      .entry-username { color: #7A8391; font-size: 11px; font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
      .entry-actions { display: flex; gap: 4px; margin-top: 7px }
      .entry-actions button {
        flex: 1;
        background: #171B22;
        border: none;
        color: #A3ABB8;
        border-radius: 999px;
        padding: 5px;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .entry-actions button:hover { background: #252B35; color: #F7F5F0 }
      .entry-actions .del-btn { flex: 0 0 34px; display: grid; place-items: center }
      .entry-actions .del-btn:hover { color: #FF7A45 }
      .entry-actions .fill-btn:hover { background: #421205; color: #FFC4A8 }

      #add-btn {
        display: block;
        width: 100%;
        background: none;
        border: 1px dashed #252B35;
        color: #7A8391;
        border-radius: 14px;
        padding: 10px;
        font-size: 12px;
        cursor: pointer;
        margin-top: 4px;
        transition: border-color 0.15s, color 0.15s;
      }
      #add-btn:hover { border-color: #FF5A1F; color: #FF7A45 }

      #empty-state { text-align: center; padding: 30px 0; color: #5B6472 }
      #empty-state .icon { font: 400 13px/1.6 'JetBrains Mono', monospace; color: #A3ABB8; margin-bottom: 8px }
      #empty-state .icon b { color: #FF5A1F; font-weight: 500 }
      .cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.2em; background: #FF5A1F; border-radius: 1.5px; animation: blink 1.1s steps(1) infinite }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none } }

      /* ── Add entry panel ── */
      #add-panel { display: none }
      #add-panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px }
      #add-panel input {
        display: block;
        width: 100%;
        background: #171B22;
        border: 1px solid #252B35;
        border-radius: 8px;
        color: #F7F5F0;
        padding: 7px 10px;
        font-size: 12px;
        outline: none;
        margin-bottom: 6px;
        transition: border-color 0.15s;
      }
      #add-panel input:focus { border-color: #FF5A1F }
      .form-row { display: flex; gap: 6px; margin-top: 4px }

      /* ── Copied toast ── */
      #copied-toast {
        display: none;
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: #0B857A;
        color: #fff;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
      }

      /* ── Spinner ── */
      .spinner {
        width: 20px; height: 20px;
        border: 2px solid #252B35;
        border-top-color: #FF5A1F;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 40px auto;
      }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <header>
      <svg width="24" height="24" viewBox="0 0 64 64" role="img" aria-label="Roko"><rect width="64" height="64" rx="16" fill="#F7F5F0"/><path d="M20 43V33a12 12 0 0 1 12-12h2" fill="none" stroke-width="8" stroke-linecap="round" stroke="#0E1116"/><rect x="39" y="37" width="10" height="10" rx="1.5" fill="#FF5A1F"/></svg>
      <h1>Roko<small>PW</small></h1>
      <button id="lock-btn" title="Lock vault" aria-label="Lock vault" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </header>

    <main>
      <!-- Loading -->
      <div id="loading-screen">
        <div class="spinner"></div>
      </div>

      <!-- Unlock / Create -->
      <div id="unlock-screen" style="display:none">
        <div id="create-form" style="display:none">
          <h2>Create a new vault</h2>
          <div id="create-error" class="error" style="display:none"></div>
          <input id="create-password" type="password" placeholder="Master password (min 8 chars)" autocomplete="new-password" />
          <input id="create-confirm" type="password" placeholder="Confirm master password" autocomplete="new-password" />
          <button id="create-submit" class="btn-primary">Create vault</button>
        </div>
        <div id="unlock-form">
          <h2>Unlock your vault</h2>
          <div id="unlock-error" class="error" style="display:none"></div>
          <input id="unlock-password" type="password" placeholder="Master password" autocomplete="current-password" />
          <button id="unlock-submit" class="btn-primary">Unlock</button>
        </div>
        <button id="toggle-mode" type="button"></button>
      </div>

      <!-- Vault list -->
      <div id="vault-screen" style="display:none">
        <input id="search-input" type="search" placeholder="Search…" />
        <h2 id="list-heading">All credentials</h2>
        <div id="entries-list"></div>
        <div id="empty-state" style="display:none">
          <div class="icon"><b>$</b> roko list <span class="cursor"></span></div>
          <p>No credentials yet</p>
        </div>
        <button id="add-btn" type="button">+ Add credential</button>

        <div id="passkeys-section" style="display:none; margin-top:16px">
          <h2>Passkeys</h2>
          <div id="passkeys-list"></div>
        </div>
      </div>

      <!-- Add entry panel -->
      <div id="add-panel">
        <h2>Add credential</h2>
        <div id="add-error" class="error" style="display:none"></div>
        <input id="add-title" type="text" placeholder="Title (e.g. GitHub)" />
        <input id="add-url" type="url" placeholder="Website URL (optional)" />
        <input id="add-username" type="text" placeholder="Username or email" autocomplete="off" />
        <input id="add-password" type="password" placeholder="Password" autocomplete="new-password" />
        <div class="form-row">
          <button id="add-cancel" class="btn-ghost">Cancel</button>
          <button id="add-save" class="btn-primary" style="margin-top:0">Save</button>
        </div>
      </div>
    </main>

    <div id="copied-toast">Copied!</div>

    <script src="popup.js"></script>
  </body>
</html>
