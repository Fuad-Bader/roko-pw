services:
  roko-server:
    build:
      # The image also contains the admin console, which lives in apps/admin.
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "4567:4567"
    volumes:
      - roko-data:/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  roko-data:
